<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobQuest — Discovery Queue</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
  h1 { font-size: 1.5em; margin-bottom: 16px; color: #58a6ff; }
  .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select { background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 12px; border-radius: 6px; font-size: 14px; }
  .toolbar input { width: 240px; }
  .stats { color: #8b949e; font-size: 13px; margin-left: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 10px 12px; border-bottom: 1px solid #30363d; color: #8b949e; font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: #c9d1d9; }
  th .arrow { font-size: 10px; margin-left: 4px; }
  td { padding: 10px 12px; border-bottom: 1px solid #21262d; }
  tr:hover { background: #161b22; }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 11px; margin-left: 4px; }
  .tag-growth { background: #23863633; color: #3fb950; border: 1px solid #23863655; }
  .tag-ai { background: #6e40c933; color: #a371f7; border: 1px solid #6e40c955; }
  .tag-generalist { background: #9e6a0333; color: #d29922; border: 1px solid #9e6a0355; }
  .tag-de { background: #30363d; color: #8b949e; }
  .tag-es { background: #30363d; color: #8b949e; }
  .tag-remote { background: #1f6feb33; color: #79c0ff; border: 1px solid #1f6feb55; }
  .empty { text-align: center; padding: 40px; color: #484f58; }
</style>
</head>
<body>
<h1>🔍 Job Discovery Queue</h1>

<div class="toolbar">
  <input type="text" id="search" placeholder="Search..." oninput="render()">
  <select id="role-filter" onchange="render()">
    <option value="">All roles</option>
    <option value="growth">Growth PM</option>
    <option value="ai">AI PM</option>
    <option value="generalist">Generalist PM</option>
  </select>
  <select id="country-filter" onchange="render()">
    <option value="">All countries</option>
    <option value="de">🇩🇪 Germany</option>
    <option value="es">🇪🇸 Spain</option>
  </select>
  <span class="stats" id="stats"></span>
</div>

<table>
  <thead>
    <tr>
      <th onclick="sortBy('company')">Company <span class="arrow" id="arrow-company"></span></th>
      <th onclick="sortBy('title')">Role <span class="arrow" id="arrow-title"></span></th>
      <th onclick="sortBy('location')">Location <span class="arrow" id="arrow-location"></span></th>
      <th onclick="sortBy('date')">Date <span class="arrow" id="arrow-date"></span></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
<div class="empty" id="empty" style="display:none">No jobs discovered yet.</div>

<script>
// JOBS DATA — populated by discovery, manually edited, or via agent
const JOBS = [
  // { company, title, url, location, country, roleType, date, source }
];

let sortCol = 'date';
let sortDir = -1;

function roleTag(type) {
  const map = { growth: 'tag-growth', ai: 'tag-ai', generalist: 'tag-generalist' };
  return `<span class="tag ${map[type] || ''}">${type}</span>`;
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const roleFilter = document.getElementById('role-filter').value;
  const countryFilter = document.getElementById('country-filter').value;

  let filtered = JOBS;
  if (search) {
    filtered = filtered.filter(j =>
      (j.company || '').toLowerCase().includes(search) ||
      (j.title || '').toLowerCase().includes(search) ||
      (j.location || '').toLowerCase().includes(search)
    );
  }
  if (roleFilter) filtered = filtered.filter(j => j.roleType === roleFilter);
  if (countryFilter) filtered = filtered.filter(j => j.country === countryFilter);

  filtered.sort((a, b) => {
    let va = a[sortCol] || '', vb = b[sortCol] || '';
    if (sortCol === 'date') { va = va.toString(); vb = vb.toString(); }
    return va < vb ? -1 * sortDir : va > vb ? 1 * sortDir : 0;
  });

  document.querySelectorAll('.arrow').forEach(el => el.textContent = '');
  const arrow = document.getElementById('arrow-' + sortCol);
  if (arrow) arrow.textContent = sortDir === 1 ? '▲' : '▼';

  document.getElementById('stats').textContent = `${filtered.length} jobs`;

  const tbody = document.getElementById('tbody');
  if (filtered.length === 0) {
    tbody.innerHTML = '';
    document.getElementById('empty').style.display = 'block';
    return;
  }
  document.getElementById('empty').style.display = 'none';

  tbody.innerHTML = filtered.map(j => `
    <tr>
      <td><a href="${j.url}" target="_blank">${j.company || '?'}</a> ${roleTag(j.roleType)}</td>
      <td>${j.title || '?'}</td>
      <td>${j.location || ''} ${j.country === 'de' ? '<span class="tag tag-de">DE</span>' : ''}${j.country === 'es' ? '<span class="tag tag-es">ES</span>' : ''}${(j.location||'').toLowerCase().includes('remote') ? '<span class="tag tag-remote">remote</span>' : ''}</td>
      <td>${j.date || ''}</td>
    </tr>
  `).join('');
}

function sortBy(col) {
  if (sortCol === col) { sortDir = -sortDir; }
  else { sortCol = col; sortDir = col === 'date' ? -1 : 1; }
  render();
}

render();
</script>
</body>
</html>
