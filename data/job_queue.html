          url: "https://es.linkedin.com/jobs/view/sr-product-manager-supply-strategy-surface-transportation-at-amazon-4172826597",
          location: "Madrid",
          country: "es",
          roleType: "generalist",
          date: "2026-05-07",
          source: "linkedin",
        },
      ];

      let sortCol = "date";
      let sortDir = -1;

      function roleTag(type) {
        const map = {
          growth: "tag-growth",
          ai: "tag-ai",
          generalist: "tag-generalist",
        };
        return `<span class="tag ${map[type] || ""}">${type}</span>`;
      }

      function render() {
        const search = document.getElementById("search").value.toLowerCase();
        const roleFilter = document.getElementById("role-filter").value;
        const countryFilter = document.getElementById("country-filter").value;

        let filtered = JOBS;
        if (search) {
          filtered = filtered.filter(
            (j) =>
              (j.company || "").toLowerCase().includes(search) ||
              (j.title || "").toLowerCase().includes(search) ||
              (j.location || "").toLowerCase().includes(search),
          );
        }
        if (roleFilter)
          filtered = filtered.filter((j) => j.roleType === roleFilter);
        if (countryFilter)
          filtered = filtered.filter((j) => j.country === countryFilter);

        filtered.sort((a, b) => {
          let va = a[sortCol] || "",
            vb = b[sortCol] || "";
          if (sortCol === "date") {
            va = va.toString();
            vb = vb.toString();
          }
          return va < vb ? -1 * sortDir : va > vb ? 1 * sortDir : 0;
        });

        document
          .querySelectorAll(".arrow")
          .forEach((el) => (el.textContent = ""));
        const arrow = document.getElementById("arrow-" + sortCol);
        if (arrow) arrow.textContent = sortDir === 1 ? "▲" : "▼";

        document.getElementById("stats").textContent =
          `${filtered.length} jobs`;

        const tbody = document.getElementById("tbody");
        if (filtered.length === 0) {
          tbody.innerHTML = "";
          document.getElementById("empty").style.display = "block";
          return;
        }
        document.getElementById("empty").style.display = "none";

        tbody.innerHTML = filtered
          .map(
            (j) => `
    <tr>
      <td><a href="${j.url}" target="_blank">${j.company || "?"}</a> ${roleTag(j.roleType)}</td>
      <td>${j.title || "?"}</td>
      <td>${j.location || ""} ${j.country === "de" ? '<span class="tag tag-de">DE</span>' : ""}${j.country === "es" ? '<span class="tag tag-es">ES</span>' : ""}${(j.location || "").toLowerCase().includes("remote") ? '<span class="tag tag-remote">remote</span>' : ""}</td>
      <td>${j.date || ""}</td>
    </tr>
  `,
          )
          .join("");
      }

      function sortBy(col) {
        if (sortCol === col) {
          sortDir = -sortDir;
        } else {
          sortCol = col;
          sortDir = col === "date" ? -1 : 1;
        }
        render();
      }

      render();
    </script>
  </body>
</html>
