<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobQuest — Application Tracker</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0d1117;
        color: #c9d1d9;
        padding: 20px;
      }
      h1 {
        font-size: 1.5em;
        margin-bottom: 16px;
        color: #58a6ff;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
        align-items: center;
      }
      .toolbar input,
      .toolbar select {
        background: #161b22;
        border: 1px solid #30363d;
        color: #c9d1d9;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 14px;
      }
      .toolbar input {
        width: 260px;
      }
      .toolbar input::placeholder {
        color: #484f58;
      }
      #add-btn {
        background: #30363d;
        border: 1px solid #484f58;
        color: #c9d1d9;
        padding: 6px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      #add-btn:hover {
        background: #484f58;
      }
      #save-btn {
        background: #238636;
        border: none;
        color: white;
        padding: 6px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        display: none;
      }
      #save-btn:hover {
        background: #2ea043;
      }
      #save-btn.dirty {
        display: inline-block;
      }
      #sync-from-queue-btn {
        background: #1f6feb;
        border: none;
        color: white;
        padding: 6px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        display: none;
      }
      #sync-from-queue-btn:hover {
        background: #388bfd;
      }
      #sync-from-queue-btn.dirty {
        display: inline-block;
      }
      .stats {
        color: #8b949e;
        font-size: 13px;
        margin-left: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid #30363d;
        color: #8b949e;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      th:hover {
        color: #c9d1d9;
      }
      th .arrow {
        font-size: 10px;
        margin-left: 4px;
      }
      td {
        padding: 10px 12px;
        border-bottom: 1px solid #21262d;
        vertical-align: middle;
      }
      .file-link {
        color: #58a6ff;
        font-size: 12px;
        text-decoration: none;
      }
      .file-link:hover {
        text-decoration: underline;
      }
      .qa-btn {
        background: none;
        border: 1px solid #30363d;
        color: #8b949e;
        padding: 2px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
      }
      .qa-btn:hover {
        border-color: #58a6ff;
        color: #58a6ff;
      }
      .editor-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 200;
        align-items: center;
        justify-content: center;
      }
      .editor-modal.open {
        display: flex;
      }
      .editor-modal-content {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 24px;
        width: 700px;
        max-width: 92vw;
        max-height: 85vh;
        display: flex;
        flex-direction: column;
      }
      .editor-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .editor-modal-header h3 {
        color: #58a6ff;
        font-size: 1.1em;
        margin: 0;
      }
      .editor-modal-header .close-btn {
        background: none;
        border: none;
        color: #8b949e;
        font-size: 22px;
        cursor: pointer;
        line-height: 1;
      }
      .editor-modal-header .close-btn:hover {
        color: #c9d1d9;
      }
      .editor-modal textarea {
        background: #0d1117;
        border: 1px solid #30363d;
        color: #c9d1d9;
        padding: 12px;
        border-radius: 6px;
        font-size: 13px;
        font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
        line-height: 1.5;
        resize: vertical;
        width: 100%;
        flex: 1;
        min-height: 300px;
        box-sizing: border-box;
      }
      .editor-modal textarea:focus {
        outline: none;
        border-color: #58a6ff;
      }
      .editor-modal-footer {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        justify-content: flex-end;
      }
      .editor-modal-footer button {
        padding: 6px 14px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-size: 13px;
      }
      .btn-save-modal {
        background: #238636;
        color: white;
      }
      .btn-save-modal:hover {
        background: #2ea043;
      }
      .btn-recompile {
        background: #1f6feb;
        color: white;
      }
      .btn-recompile:hover {
        background: #388bfd;
      }
      .btn-remove {
        background: #da3633;
        color: white;
      }
      .btn-remove:hover {
        background: #f85149;
      }
      .btn-cancel-modal {
        background: #30363d;
        color: #8b949e;
      }
      .btn-cancel-modal:hover {
        color: #c9d1d9;
      }
      .editor-modal-status {
        font-size: 12px;
        color: #8b949e;
        margin-top: 8px;
        text-align: right;
      }
      .editor-modal-status.error {
        color: #da3633;
      }
      .editor-modal-status.success {
        color: #238636;
      }
      tr:hover {
        background: #161b22;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
      }
      .badge-strong {
        background: #238636;
        color: white;
      }
      .badge-good {
        background: #9e6a03;
        color: white;
      }
      .badge-weak {
        background: #6e40c9;
        color: white;
      }
      .badge-skip {
        background: #da3633;
        color: white;
      }
      .badge-na {
        background: #30363d;
        color: #8b949e;
      }
      select.status-select {
        background: #161b22;
        border: 1px solid #30363d;
        color: #c9d1d9;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 13px;
      }
      input.notes-input {
        background: #161b22;
        border: 1px solid #30363d;
        color: #c9d1d9;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 13px;
        width: 100%;
        min-width: 120px;
      }
      .url-link {
        font-size: 12px;
        color: #484f58;
        max-width: 200px;
        display: inline-block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-decoration: none;
      }
      .url-link:hover {
        color: #58a6ff;
        text-decoration: underline;
      }
      td.days {
        color: #8b949e;
        font-size: 13px;
      }
      a {
        color: #58a6ff;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .empty {
        text-align: center;
        padding: 40px;
        color: #484f58;
      }
    </style>
  </head>
  <body>
    <h1>📋 JobQuest Tracker</h1>

    <div class="toolbar">
      <input
        type="text"
        id="search"
        placeholder="Search company, role or URL…"
        oninput="render()"
      />
      <select id="status-filter" onchange="render()">
        <option value="">All statuses</option>
        <option value="applied">Applied</option>
        <option value="screening">Screening</option>
        <option value="interview">Interview</option>
        <option value="offer">Offer</option>
        <option value="rejected">Rejected</option>
        <option value="skipped">Skipped</option>
      </select>
      <button id="add-btn" onclick="showAddForm()">+ Log Application</button>
      <button id="save-btn" onclick="save()">💾 Save Changes</button>
      <span class="stats" id="stats"></span>
    </div>

    <div
      id="analytics"
      style="display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap"
    ></div>

    <!-- Add Application Modal -->
    <div
      id="add-modal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 100;
        align-items: center;
        justify-content: center;
      "
    >
      <div
        style="
          background: #161b22;
          border: 1px solid #30363d;
          border-radius: 8px;
          padding: 24px;
          width: 480px;
          max-width: 90vw;
        "
      >
        <h3 style="margin-bottom: 16px; color: #58a6ff; font-size: 1.1em">
          Log New Application
        </h3>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <input
            id="new-company"
            placeholder="Company name"
            style="
              background: #0d1117;
              border: 1px solid #30363d;
              color: #c9d1d9;
              padding: 8px 12px;
              border-radius: 6px;
              font-size: 14px;
            "
          />
          <input
            id="new-role"
            placeholder="Role title"
            style="
              background: #0d1117;
              border: 1px solid #30363d;
              color: #c9d1d9;
              padding: 8px 12px;
              border-radius: 6px;
              font-size: 14px;
            "
          />
          <input
            id="new-url"
            placeholder="Job posting URL"
            style="
              background: #0d1117;
              border: 1px solid #30363d;
              color: #c9d1d9;
              padding: 8px 12px;
              border-radius: 6px;
              font-size: 14px;
            "
          />
          <div style="display: flex; gap: 8px">
            <select
              id="new-status"
              style="
                background: #0d1117;
                border: 1px solid #30363d;
                color: #c9d1d9;
                padding: 8px 12px;
                border-radius: 6px;
                font-size: 14px;
                flex: 1;
              "
            >
              <option value="applied">Applied</option>
              <option value="screening">Screening</option>
              <option value="interview">Interview</option>
              <option value="offer">Offer</option>
              <option value="rejected">Rejected</option>
            </select>
            <input
              id="new-date"
              type="date"
              style="
                background: #0d1117;
                border: 1px solid #30363d;
                color: #c9d1d9;
                padding: 8px 12px;
                border-radius: 6px;
                font-size: 14px;
                flex: 1;
              "
            />
          </div>
          <input
            id="new-notes"
            placeholder="Notes (optional)"
            style="
              background: #0d1117;
              border: 1px solid #30363d;
              color: #c9d1d9;
              padding: 8px 12px;
              border-radius: 6px;
              font-size: 14px;
            "
          />
          <div
            id="add-error"
            style="color: #da3633; font-size: 13px; display: none"
          ></div>
          <div style="display: flex; gap: 8px; margin-top: 4px">
            <button
              onclick="addApplication()"
              style="
                background: #238636;
                border: none;
                color: white;
                padding: 8px 16px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                flex: 1;
              "
            >
              Add
            </button>
            <button
              onclick="hideAddForm()"
              style="
                background: #30363d;
                border: none;
                color: #c9d1d9;
                padding: 8px 16px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
              "
            >
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th onclick="sortBy('company')">
            Company <span class="arrow" id="arrow-company"></span>
          </th>
          <th onclick="sortBy('role')">
            Role <span class="arrow" id="arrow-role"></span>
          </th>
          <th>URL</th>
          <th onclick="sortBy('score')">
            Score <span class="arrow" id="arrow-score"></span>
          </th>
          <th onclick="sortBy('date')">
            Date <span class="arrow" id="arrow-date"></span>
          </th>
          <th>Days</th>
          <th>Status</th>
          <th>Q&A</th>
          <th>Cover</th>
          <th>Resume</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display: none">
      No applications yet. Run the pipeline or click "+ Log Application" to add
      one.
    </div>

    <script>
      let apps = [];
      let sortCol = "date";
      let sortDir = -1;
      let dirty = false;

      const STATUS_OPTIONS = [
        "applied",
        "screening",
        "interview",
        "offer",
        "rejected",
        "skipped",
      ];

      async function load() {
        try {
          const resp = await fetch("/api/applications");
          apps = await resp.json();
          render();
        } catch (e) {
          document.getElementById("empty").style.display = "block";
          document.getElementById("empty").textContent =
            "Could not load applications. Start the server: python serve_tracker.py";
        }
      }

      function scoreBadge(score, label) {
        if (score == null) return '<span class="badge badge-na">—</span>';
        const cls =
          {
            STRONG: "badge-strong",
            GOOD: "badge-good",
            WEAK: "badge-weak",
            SKIP: "badge-skip",
          }[label] || "badge-na";
        return `<span class="badge ${cls}">${score} ${label}</span>`;
      }

      function daysAgo(dateStr) {
        if (!dateStr) return "";
        return Math.floor(
          (new Date() - new Date(dateStr)) / (1000 * 60 * 60 * 24),
        );
      }

      function render() {
        const search = document.getElementById("search").value.toLowerCase();
        const statusFilter = document.getElementById("status-filter").value;

        let filtered = apps;
        if (search) {
          filtered = filtered.filter(
            (a) =>
              (a.company || "").toLowerCase().includes(search) ||
              (a.role || "").toLowerCase().includes(search) ||
              (a.url || "").toLowerCase().includes(search),
          );
        }
        if (statusFilter)
          filtered = filtered.filter((a) => a.status === statusFilter);

        filtered.sort((a, b) => {
          let va = a[sortCol] || "",
            vb = b[sortCol] || "";
          if (sortCol === "score") {
            va = Number(va) || 0;
            vb = Number(vb) || 0;
          }
          if (sortCol === "date") {
            va = va.toString();
            vb = vb.toString();
          }
          return va < vb ? -1 * sortDir : va > vb ? 1 * sortDir : 0;
        });

        document
          .querySelectorAll(".arrow")
          .forEach((el) => (el.textContent = ""));
        const arrow = document.getElementById("arrow-" + sortCol);
        if (arrow) arrow.textContent = sortDir === 1 ? "▲" : "▼";

        document.getElementById("stats").textContent =
          `${filtered.length} applications`;

        // Analytics
        const analytics = document.getElementById("analytics");
        const total = apps.length;
        if (total === 0) {
          analytics.innerHTML = "";
        } else {
          const counts = {};
          const scores = { strong: 0, good: 0, weak: 0, skip: 0 };
          apps.forEach((a) => {
            counts[a.status] = (counts[a.status] || 0) + 1;
            if (a.score_label === "STRONG") scores.strong++;
            else if (a.score_label === "GOOD") scores.good++;
            else if (a.score_label === "WEAK") scores.weak++;
            else if (a.score_label === "SKIP") scores.skip++;
          });
          const responded =
            (counts["screening"] || 0) +
            (counts["interview"] || 0) +
            (counts["offer"] || 0);
          const responseRate =
            total > 0 ? Math.round((responded / total) * 100) : 0;
          analytics.innerHTML = `
          <div style="background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 16px;">
            <span style="color:#8b949e;font-size:12px;">TOTAL</span><br>
            <span style="font-size:24px;font-weight:700;">${total}</span>
          </div>
          <div style="background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 16px;">
            <span style="color:#8b949e;font-size:12px;">RESPONSE RATE</span><br>
            <span style="font-size:24px;font-weight:700;color:${responseRate > 20 ? "#238636" : responseRate > 0 ? "#9e6a03" : "#8b949e"};">${responseRate}%</span>
          </div>
          <div style="background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 16px;">
            <span style="color:#8b949e;font-size:12px;">SCORES</span><br>
            <span style="font-size:14px;"><span style="color:#238636;">${scores.strong} strong</span> · <span style="color:#9e6a03;">${scores.good} good</span> · <span style="color:#6e40c9;">${scores.weak} weak</span> · <span style="color:#da3633;">${scores.skip} skip</span></span>
          </div>
          <div style="background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 16px;">
            <span style="color:#8b949e;font-size:12px;">FUNNEL</span><br>
            <span style="font-size:14px;">${counts["applied"] || 0} applied → ${counts["screening"] || 0} screening → ${counts["interview"] || 0} interview → ${counts["offer"] || 0} offer</span>
          </div>`;
        }

        const tbody = document.getElementById("tbody");
        if (filtered.length === 0) {
          tbody.innerHTML = "";
          document.getElementById("empty").style.display = "block";
          return;
        }
        document.getElementById("empty").style.display = "none";

        tbody.innerHTML = filtered
          .map((a, i) => {
            const idx = apps.indexOf(a);
            const days = daysAgo(a.date);
            const shortUrl = (a.url || "")
              .replace(/^https?:\/\/(www\.)?/, "")
              .substring(0, 38);
            const hasQa = a.qa && a.qa.length > 0;
            const hasCl = (a.cover_letter_content && a.cover_letter_content.length > 0) || (a.cover_letter && a.cover_letter.length > 0);
            const hasResume = (a.resume_content && a.resume_content.length > 0) || (a.resume && a.resume.length > 0) || (a.pdf_path && a.pdf_path.length > 0);
            return `<tr>
          <td><strong>${a.company || "?"}</strong></td>
          <td>${a.role || "?"}</td>
          <td><a href="${a.url || "#"}" target="_blank" class="url-link" title="${a.url || ""}">${shortUrl}…</a></td>
          <td>${scoreBadge(a.score, a.score_label)}</td>
          <td>${a.date || ""}</td>
          <td class="days">${days !== "" ? days + "d" : ""}</td>
          <td><select class="status-select" data-idx="${idx}" onchange="markDirty()">${STATUS_OPTIONS.map((s) => `<option value="${s}" ${a.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></td>
          <td>${hasQa ? `<button class="qa-btn" onclick="openEditor(${idx}, 'qa')">Q&A</button>` : `<button class="qa-btn" onclick="openEditor(${idx}, 'qa')" style="opacity:0.5;">+Q&A</button>`}</td>
          <td>${hasCl ? `<button class="qa-btn" onclick="openEditor(${idx}, 'cover_letter')">Cover</button>` : `<button class="qa-btn" onclick="openEditor(${idx}, 'cover_letter')" style="opacity:0.5;">+CL</button>`}</td>
          <td>${hasResume ? `<button class="qa-btn" onclick="openEditor(${idx}, 'resume')">Resume</button>` : `<button class="qa-btn" onclick="openEditor(${idx}, 'resume')" style="opacity:0.5;">+Res</button>`}</td>
          <td><input class="notes-input" data-idx="${idx}" value="${(a.notes || "").replace(/"/g, "&quot;")}" oninput="markDirty()" placeholder="Add note…"></td>
        </tr>`;
          })
          .join("");
      }

      function markDirty() {
        dirty = true;
        document.getElementById("save-btn").classList.add("dirty");
      }

      function sortBy(col) {
        sortCol = col;
        sortDir = sortCol === col ? -sortDir : col === "date" ? -1 : 1;
        render();
      }

      async function save() {
        document.querySelectorAll(".status-select").forEach((sel) => {
          apps[parseInt(sel.dataset.idx)].status = sel.value;
        });
        document.querySelectorAll(".notes-input").forEach((inp) => {
          apps[parseInt(inp.dataset.idx)].notes = inp.value;
        });
        try {
          const resp = await fetch("/api/applications", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(apps),
          });
          if (resp.ok) {
            dirty = false;
            document.getElementById("save-btn").classList.remove("dirty");
            render();
          }
        } catch (e) {
          alert("Save failed. Is the tracker server running?");
        }
      }

      // ── Add Application modal ──
      function showAddForm() {
        document.getElementById("add-modal").style.display = "flex";
        document.getElementById("new-date").value = new Date()
          .toISOString()
          .split("T")[0];
        document.getElementById("add-error").style.display = "none";
        document.getElementById("new-company").focus();
      }
      function hideAddForm() {
        document.getElementById("add-modal").style.display = "none";
        document.getElementById("new-company").value = "";
        document.getElementById("new-role").value = "";
        document.getElementById("new-url").value = "";
        document.getElementById("new-notes").value = "";
      }
      async function addApplication() {
        const company = document.getElementById("new-company").value.trim();
        const role = document.getElementById("new-role").value.trim();
        const url = document.getElementById("new-url").value.trim();
        const status = document.getElementById("new-status").value;
        const date = document.getElementById("new-date").value;
        const notes = document.getElementById("new-notes").value.trim();
        const err = document.getElementById("add-error");

        if (!company || !role || !url) {
          err.textContent = "Company, role, and URL are required.";
          err.style.display = "block";
          return;
        }
        // Dedup check
        const normUrl = url.replace(/\/+$/, "").replace(/#.*$/, "");
        if (
          apps.some(
            (a) =>
              (a.url || "").replace(/\/+$/, "").replace(/#.*$/, "") === normUrl,
          )
        ) {
          err.textContent =
            "⚠ This URL already exists in the tracker. Duplicate application not logged.";
          err.style.display = "block";
          return;
        }
        apps.push({
          company,
          role,
          url,
          score: null,
          score_label: null,
          date,
          status,
          notes,
        });
        try {
          const resp = await fetch("/api/applications", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(apps),
          });
          if (resp.ok) {
            hideAddForm();
            render();
          }
        } catch (e) {
          alert("Save failed. Is the tracker server running?");
        }
      }

      // Q&A modal
      // ── Editor Modal (Q&A, Cover Letter, Resume) ──
      let editorIdx = -1;
      let editorField = '';

      function openEditor(idx, field) {
        const a = apps[idx];
        if (!a) return;
        editorIdx = idx;
        editorField = field;

        const modal = document.getElementById('editor-modal');
        const title = document.getElementById('editor-modal-title');
        const textarea = document.getElementById('editor-modal-textarea');
        const status = document.getElementById('editor-modal-status');
        const recompileBtn = document.getElementById('editor-btn-recompile');
        const removeBtn = document.getElementById('editor-btn-remove');

        const fieldLabels = { qa: 'Q&A', cover_letter: 'Cover Letter', resume: 'Resume' };
        title.textContent = `${fieldLabels[field] || field} — ${a.company} — ${a.role}`;
        status.textContent = '';
        status.className = 'editor-modal-status';

        // Show/hide recompile and remove buttons (only for cover_letter and resume)
        if (field === 'qa') {
          recompileBtn.style.display = 'none';
          removeBtn.style.display = 'none';
        } else {
          recompileBtn.style.display = 'inline-block';
          removeBtn.style.display = 'inline-block';
        }

        // Fill textarea with content
        if (field === 'qa') {
          textarea.value = a.qa || '';
        } else if (field === 'cover_letter') {
          textarea.value = a.cover_letter_content || '';
        } else if (field === 'resume') {
          textarea.value = a.resume_content || '';
        }

        modal.classList.add('open');
        textarea.focus();
      }

      function closeEditor() {
        document.getElementById('editor-modal').classList.remove('open');
        editorIdx = -1;
        editorField = '';
      }

      function saveEditorContent() {
        const a = apps[editorIdx];
        if (!a) return;
        const textarea = document.getElementById('editor-modal-textarea');
        const status = document.getElementById('editor-modal-status');

        if (editorField === 'qa') {
          a.qa = textarea.value;
        } else if (editorField === 'cover_letter') {
          a.cover_letter_content = textarea.value;
        } else if (editorField === 'resume') {
          a.resume_content = textarea.value;
        }

        markDirty();
        status.textContent = '✓ Saved to session. Click "Save Changes" above to persist.';
        status.className = 'editor-modal-status success';
        render();
      }

      async function recompilePdf() {
        const a = apps[editorIdx];
        if (!a) return;
        const textarea = document.getElementById('editor-modal-textarea');
        const status = document.getElementById('editor-modal-status');

        // First save the content to the app
        if (editorField === 'cover_letter') {
          a.cover_letter_content = textarea.value;
        } else if (editorField === 'resume') {
          a.resume_content = textarea.value;
        }

        status.textContent = '⏳ Recompiling PDF...';
        status.className = 'editor-modal-status';

        try {
          const resp = await fetch('/api/recompile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              app_idx: editorIdx,
              field: editorField,
              content: textarea.value,
            }),
          });
          const result = await resp.json();
          if (result.ok) {
            status.textContent = `✅ PDF recompiled: ${result.pdf_path || 'done'}`;
            status.className = 'editor-modal-status success';
            markDirty();
            render();
          } else {
            status.textContent = `❌ ${result.error || 'Recompilation failed'}`;
            status.className = 'editor-modal-status error';
          }
        } catch (e) {
          status.textContent = `❌ Error: ${e.message}`;
          status.className = 'editor-modal-status error';
        }
      }

      function removeEditorFile() {
        const a = apps[editorIdx];
        if (!a) return;
        if (!confirm(`Remove ${editorField} for ${a.company}?`)) return;

        if (editorField === 'cover_letter') {
          a.cover_letter = '';
          a.cover_letter_content = '';
        } else if (editorField === 'resume') {
          a.resume = '';
          a.resume_content = '';
        }

        const status = document.getElementById('editor-modal-status');
        status.textContent = '✓ Removed. Click "Save Changes" to persist.';
        status.className = 'editor-modal-status success';
        document.getElementById('editor-modal-textarea').value = '';
        markDirty();
        closeEditor();
        render();
      }

      load();
    </script>

    <!-- Editor Modal (Q&A, Cover Letter, Resume) -->
    <div id="editor-modal" class="editor-modal" onclick="closeEditor()">
      <div class="editor-modal-content" onclick="event.stopPropagation()">
        <div class="editor-modal-header">
          <h3 id="editor-modal-title"></h3>
          <button class="close-btn" onclick="closeEditor()">&times;</button>
        </div>
        <textarea id="editor-modal-textarea" placeholder="Enter content here..."></textarea>
        <div class="editor-modal-footer">
          <button class="btn-remove" id="editor-btn-remove" onclick="removeEditorFile()">Remove</button>
          <button class="btn-recompile" id="editor-btn-recompile" onclick="recompilePdf()">Recompile PDF</button>
          <button class="btn-cancel-modal" onclick="closeEditor()">Cancel</button>
          <button class="btn-save-modal" onclick="saveEditorContent()">Save</button>
        </div>
        <div id="editor-modal-status" class="editor-modal-status"></div>
      </div>
    </div>
  </body>
</html>
