# JobQuest — Portal Scanner Configuration
#
# Companies to monitor for new job openings.
# Read by modes/discover.md (agent instruction) and modes/scan.md (portal scanner).

search_queries:
  # Broad cross-ATS searches — discovers new companies not yet tracked
  - query: 'site:jobs.ashbyhq.com "Senior Product Manager" Berlin'
    enabled: true
  - query: 'site:boards.greenhouse.io "Product Manager" Growth'
    enabled: true
  - query: 'site:jobs.lever.co "Senior Product Manager" Germany'
    enabled: true

